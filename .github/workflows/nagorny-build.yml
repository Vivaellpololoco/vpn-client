# Nagorny Express: simple build of the Windows portable zip and the Android APKs.
# Run by hand: Actions -> "Nagorny build" -> Run workflow. No store or signing secrets needed.
# Android APKs are signed with the debug key unless android/key.properties is created (see docs).
name: Nagorny build

on:
  workflow_dispatch:

env:
  CHANNEL: prod
  SENTRY_DSN: ""

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows

      - name: Build the portable zip
        run: make windows-zip-release

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $z = Get-ChildItem -Path dist -Recurse -File -Filter *.zip | Select-Object -First 1
          Copy-Item $z.FullName out\NagornyExpress-Windows-x64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: NagornyExpress-Windows
          path: out/NagornyExpress-Windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk

      - name: Build
        run: make android-apk-release

      - name: Collect
        run: |
          mkdir out
          apk=build/app/outputs/flutter-apk
          ls -R build/app/outputs
          cp $apk/*arm64-v8a*.apk out/NagornyExpress-Android-arm64.apk || echo "no arm64 apk"
          cp $apk/app-release.apk out/NagornyExpress-Android-universal.apk || echo "no universal apk"

      - uses: actions/upload-artifact@v6
        with:
          name: NagornyExpress-Android
          path: out/*.apk
          if-no-files-found: error
