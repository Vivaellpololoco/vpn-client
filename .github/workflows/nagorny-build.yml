# Nagorny Express: simple build of the Windows portable zip and the Android APKs.
# Run by hand: Actions -> "Nagorny build" -> Run workflow. No store or signing secrets needed.
# Android APKs are signed with the debug key unless android/key.properties is created (see docs).
name: Nagorny build

on:
  workflow_dispatch:

env:
  CHANNEL: dev
  SENTRY_DSN: ""

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows

      - name: Build the portable zip
        run: make windows-zip-release

      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $z = Get-ChildItem -Path dist -Recurse -File -Filter *.zip | Select-Object -First 1
          Copy-Item $z.FullName out\NagornyExpress-Windows-x64.zip

      - uses: actions/upload-artifact@v6
        with:
          name: NagornyExpress-Windows
          path: out/NagornyExpress-Windows-x64.zip
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - uses: ./.github/actions/setup-flutter
        with:
          platform: android-apk

      # The permanent Nagorny key (repository secrets), so a new APK installs over the old one.
      # Without the secrets the APK is signed with the debug key.
      - name: Set up the signing key
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "No signing key: debug-signed APK"; exit 0; fi
          echo "$SIGNING_KEY" | base64 --decode > android/key.jks
          printf '%s=%s\n' \
            storeFile "$PWD/android/key.jks" \
            storePassword "$STORE_PASSWORD" \
            keyPassword "$KEY_PASSWORD" \
            keyAlias "$KEY_ALIAS" > android/key.properties

      - name: Build
        run: make android-apk-release

      - name: Show the APK signer
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -i "DN\|SHA-256" || true

      - name: Collect
        run: |
          mkdir out
          apk=build/app/outputs/flutter-apk
          ls -R build/app/outputs
          cp $apk/*arm64-v8a*.apk out/NagornyExpress-Android-arm64.apk || echo "no arm64 apk"
          cp $apk/app-release.apk out/NagornyExpress-Android-universal.apk || echo "no universal apk"

      - uses: actions/upload-artifact@v6
        with:
          name: NagornyExpress-Android
          path: out/*.apk
          if-no-files-found: error
